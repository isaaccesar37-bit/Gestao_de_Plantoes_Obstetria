<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d74a9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plantão+">
<link rel="icon" type="image/png" href="./icons/brand-mark.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>PLANTÃO+ | Gestão de plantões</title>
<style>
:root{--ink:#163250;--muted:#6c8192;--line:#dce7eb;--paper:#f4f8fa;--white:#fff;--teal:#1d74a9;--teal2:#e6f1f8;--navy:#163250;--green:#0daf74;--green-soft:#e7f6ef;--gold:#e5a840;--red:#b85454;--shadow:0 12px 35px #16325012}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr;transition:grid-template-columns .25s ease}
.sidebar{background:var(--navy);color:#ecf5f4;padding:27px 18px;display:flex;flex-direction:column;gap:32px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{height:52px;width:52px;border-radius:14px;background:#0daf74;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0}
.logo-image{display:block;object-fit:cover;padding:0;background:transparent}
.brand .logo-image{object-fit:contain;padding:3px;background:#f4f8fa;border-radius:14px}
.brand strong{display:block;font-size:16px;letter-spacing:.2px}
.brand small{color:#a9c1c7;font-size:11px}
.brand-plus{color:#0daf74}
.brand-text small{display:block;color:#a9c1c7;font-size:10px;letter-spacing:.1px}

.sidebar-toggle-btn{border:0;background:rgba(255,255,255,.1);color:#b6cbd0;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;margin-left:auto;cursor:pointer;flex-shrink:0;transition:all .2s}
.sidebar-toggle-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.toggle-icon{display:inline-block;font-size:16px;line-height:1;transition:transform .2s ease}

.app.sidebar-collapsed{grid-template-columns:76px 1fr}
.app.sidebar-collapsed .sidebar{padding:20px 10px;gap:20px}
.app.sidebar-collapsed .brand{flex-direction:column;gap:10px;padding:0;justify-content:center}
.app.sidebar-collapsed .brand-text,.app.sidebar-collapsed .nav-label,.app.sidebar-collapsed .nav button .label,.app.sidebar-collapsed .side-note,.app.sidebar-collapsed .sidebar .side-link-box{display:none!important}
.app.sidebar-collapsed .sidebar-toggle-btn{margin-left:0}
.app.sidebar-collapsed .toggle-icon{transform:rotate(180deg)}
.app.sidebar-collapsed .nav button{justify-content:center;padding:12px 6px}

.nav-label{font-size:10px;color:#89a4ac;text-transform:uppercase;letter-spacing:1.4px;padding:0 12px;margin-bottom:8px}
.nav{display:grid;gap:6px}
.nav button{border:0;color:#b6cbd0;text-align:left;padding:12px;border-radius:10px;background:transparent;display:flex;align-items:center;gap:12px;font-size:14px}
.nav button.active,.nav button:hover{background:#ffffff17;color:#fff}
.nav .icon{font-size:17px;width:20px;text-align:center}
.side-link-box{margin-top:auto;border:1px solid #ffffff20;padding:14px;border-radius:13px;color:#c0d2d6;font-size:12px;display:flex;flex-direction:column;gap:8px}
.form-access-box{margin:22px 0 0;background:var(--navy);border-color:#ffffff20;max-width:520px;box-shadow:var(--shadow)}
.side-link-title{color:white;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.side-link-input-wrap input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:7px 9px;color:#fff;font-size:12px;outline:none}
.side-link-btn{display:flex;align-items:center;justify-content:space-between;background:#1d74a9;color:#fff;text-decoration:none;padding:8px 10px;border-radius:7px;font-weight:600;font-size:12px;transition:all .2s;border:0;cursor:pointer;width:100%}
.side-link-btn:hover{filter:brightness(1.1)}
.side-link-btn.secondary{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#ecf5f4}
.side-link-btn.secondary:hover{background:rgba(255,255,255,.22);color:#fff;filter:none}
.side-link-btn.disabled{opacity:.4;pointer-events:none}
.side-link-manage-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#b6cbd0;padding:7px 10px;border-radius:7px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:all .2s}
.side-link-manage-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.main{min-width:0}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}
.crumb{color:var(--muted);font-size:13px}
.topbar-right{display:flex;align-items:center;gap:12px}
.today{font-size:12px;color:var(--muted)}
.avatar{height:34px;width:34px;background:#e7f6ef;color:#1d74a9;border-radius:50%;display:grid;place-items:center;font-weight:700}
.content{max-width:1400px;padding:32px 36px;margin:auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.page-head h1{font-size:27px;letter-spacing:-.6px;margin:0 0 5px}
.page-head p{margin:0;color:var(--muted);font-size:14px}
.button{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 15px;border-radius:9px;font-weight:600;font-size:13px}
.button.primary{border-color:var(--teal);background:var(--teal);color:#fff}
.button:hover{filter:brightness(.97)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 22px}
.stat{padding:17px 19px;background:#fff;border:1px solid var(--line);border-radius:13px}
.stat-label{color:var(--muted);font-size:12px}
.stat-value{font-size:26px;font-weight:700;margin-top:5px;letter-spacing:-.5px}
.stat-foot{color:var(--muted);font-size:11px;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-head h2{margin:0;font-size:16px}
.card-head small{color:var(--muted)}
.data-transfer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.data-transfer-body{padding:18px 20px;display:grid;gap:14px;align-content:start}
.data-transfer-body p{margin:0;color:var(--muted);font-size:13px}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{text-align:left;padding:12px 18px;font-size:10px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;background:#fbfcfc;white-space:nowrap}
td{padding:14px 18px;border-top:1px solid #e7eef2;font-size:13px;vertical-align:middle}
td strong{font-size:13px}
.person{display:flex;gap:10px;align-items:center}
.initial{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#e7f6ef;color:var(--teal);font-weight:700}
.muted{color:var(--muted);font-size:12px}
.tag{padding:4px 8px;border-radius:20px;background:var(--teal2);color:#13766d;font-size:11px;font-weight:650;white-space:nowrap}
.tag.gray{background:#eff2f3;color:#596b73}
.actions{display:flex;gap:6px}
.icon-btn{border:0;background:transparent;color:#60747d;padding:6px;border-radius:7px}
.icon-btn:hover{background:#f0f5f4}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding:0 18px}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:12px 13px;color:var(--muted);font-size:13px;font-weight:600}
.tab.active{color:var(--teal);border-color:var(--teal)}
.matrix-tools{padding:15px 18px;display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.matrix-tools select,.search{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);font-size:13px}
.matrix-legend{display:flex;gap:14px;color:var(--muted);font-size:11px}
.matrix-legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#5cb7a8}
.dot.off{background:#cbd3d5}
.shift-head{min-width:150px}
.shift-head b{display:block;color:var(--ink);font-size:12px;text-transform:none;letter-spacing:0}
.shift-head small{font-size:10px;text-transform:none;letter-spacing:0}
.availability{display:flex;gap:5px}
.availability button{border:1px solid var(--line);background:white;color:#89969b;border-radius:7px;padding:5px 9px;font-size:11px}
.availability button.yes.selected{border-color:#9bdcb9;background:#e7f6ef;color:#16885d}
.availability button.no.selected{border-color:#e5c3c3;background:#fcf0f0;color:#a94f4f}
.roster-summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;padding:15px 18px;background:#fbfcfc;border-bottom:1px solid var(--line)}
.roster-box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white;min-height:64px}
.roster-box b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.roster-box span{font-size:12px}
.paste-panel{display:grid;grid-template-columns:1fr auto;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:end}
.paste-panel label{display:grid;gap:3px;font-size:13px}
.paste-panel label span{font-size:11px;color:var(--muted)}
.paste-panel textarea{grid-column:1/-1;width:100%;resize:vertical;border:1px solid #dce7eb;border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--ink)}
.manual-table{min-width:760px}
.manual-table th{background:#1d74a9;color:#fff;text-transform:none;letter-spacing:0;font-size:12px}
.manual-table td{padding:10px 14px}
.manual-table input,.manual-table select{width:100%;border:1px solid #dce7eb;border-radius:7px;padding:9px;background:#fff;color:var(--ink)}
.manual-table .manual-shifts-text{min-width:450px}
.manual-table select[multiple]{min-height:86px}
.manual-table .muted{display:block;margin-top:4px}
.calendar-toolbar{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.month-control{display:flex;align-items:center;gap:12px}
.month-control h2{min-width:170px;text-align:center;margin:0;font-size:17px}
.month-control button{border:1px solid var(--line);background:white;border-radius:7px;width:32px;height:32px;color:var(--ink)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));}
.weekday{padding:10px 11px;text-align:center;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--line);background:#fbfcfc}
.day{min-height:118px;border-right:1px solid #e7eef2;border-bottom:1px solid #e7eef2;padding:8px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.outside{background:#fafbfb;color:#b5c0c3}
.daynum{font-size:11px;color:#6c7d84;margin-bottom:6px}
.event{background:#e6f1f8;border-left:2px solid #0daf74;border-radius:5px;padding:5px 6px;margin:4px 0;font-size:10px;line-height:1.35;overflow:hidden}
.event strong{display:block;font-size:10px;color:#166e66}
.event span{color:#52706f}
.event.overlap{background:#fff3dc;border-color:#e1a947}
.event.available-slot{background:#f1f6fb;border-color:#6f9bc3}
.event.available-slot .schedule-names{color:#315d83}
.event.more{background:#f1f3f4;border:0;color:#61747c}
.calendar-legend{display:flex;gap:16px;padding:13px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.legend-chip{width:9px;height:9px;border-radius:3px;background:#0daf74;display:inline-block;margin-right:5px}
.legend-chip.gold{background:#e1a947}
.legend-chip.available{background:#6f9bc3}
.hint{font-size:12px;color:var(--muted);padding:12px 18px;background:#fbfcfc;border-top:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:#10263180;display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:white;border-radius:16px;width:min(520px,100%);box-shadow:0 24px 80px #0a202a55}
.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font-size:18px}
.modal-body{padding:20px 22px;display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:650;color:#425862}
.field input,.field select{border:1px solid #dce7eb;border-radius:8px;padding:10px 11px;outline:none;width:100%;background:white;color:var(--ink)}
.field input:focus,.field select:focus{border-color:#54b1a5;box-shadow:0 0 0 3px #54b1a51c}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173a46;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);z-index:60}
.import-label{display:inline-flex;align-items:center;gap:7px}
.hidden{display:none!important}
@media(max-width:850px){
  .app{grid-template-columns:70px 1fr}
  .sidebar{padding:20px 10px}
  .brand{padding:0;justify-content:center}
  .brand>div:last-child,.nav-label,.nav button .label,.side-note{display:none}
  .nav button{justify-content:center;padding:12px 6px}
  .content{padding:25px 18px}
  .topbar{padding:0 18px}
  .calendar{grid-template-columns:repeat(7,minmax(75px,1fr));overflow:auto}
  .day{min-height:90px;padding:5px}
  .event{font-size:9px;padding:4px}
  .event strong{font-size:9px}
}
@media(max-width:580px), (max-width:900px) and (max-aspect-ratio:4/5){
  .paste-panel{grid-template-columns:1fr}
  .paste-panel textarea{grid-column:auto}
  .stats{grid-template-columns:1fr 1fr}
  .stat:last-child{grid-column:span 2}
  .page-head{align-items:center}
  .page-head h1{font-size:22px}
  .today{display:none}
  .roster-summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;padding:15px 18px;background:#fbfcfc;border-bottom:1px solid var(--line)}
  .roster-box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white;min-height:64px}
  .roster-box b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
  .roster-box span{font-size:12px}
  .manual-table{min-width:760px}
  .manual-table th{background:#1d74a9;color:#fff;text-transform:none;letter-spacing:0;font-size:12px}
  .manual-table td{padding:10px 14px}
  .manual-table input,.manual-table select{width:100%;border:1px solid #dce7eb;border-radius:7px;padding:9px;background:#fff;color:var(--ink)}
  .manual-table .manual-shifts-text{min-width:450px}
  .manual-table select[multiple]{min-height:86px}
  .manual-table .muted{display:block;margin-top:4px}
  .calendar-toolbar{padding:12px}
  .month-control h2{min-width:128px;font-size:14px}
  .calendar{grid-template-columns:repeat(7,minmax(62px,1fr))}
  .weekday{padding:8px 2px;font-size:9px}
  .day{min-height:74px}
  .event span{display:none}
  .card-head{padding:15px}
  .matrix-tools{align-items:flex-start;flex-direction:column}
  .form-row{grid-template-columns:1fr}
}
.calendar .event{background:transparent;border:0;border-radius:0;padding:0 4px;margin:2px 0 0;font-size:12px;line-height:1.3;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
.calendar .event strong{display:block;font-size:12px;font-weight:400;color:var(--ink)}
.calendar .event span{display:inline;color:var(--muted)}
.calendar{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;border-color:#c6dce8}
.calendar-toolbar{background:#e6f1f8;border-bottom-color:#c6dce8}
.calendar-toolbar .month-control h2{color:#163250}
.calendar-toolbar .month-control button{border-color:#c6dce8;color:#163250}
.calendar .weekday{background:#e6f1f8;color:#163250;border-color:#c6dce8;font:600 12px/1.3 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.calendar .day{border-color:#d6e7e9}
.calendar .daynum{background:#eaf5ef;color:#1c5874;border-color:#d6e7e9;font:500 12px/1.3 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.calendar .day.outside{background:#fbfdfc;color:#aabdc7}
.calendar .event{font:12px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.calendar .event strong{color:#1d74a9;font:500 12px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.calendar .event.more{color:#607e8c}
.calendar .schedule-line{display:flex;align-items:baseline;gap:4px;background:#e7f6ef;border-left:3px solid #0daf74;border-radius:6px;padding:4px 6px;margin:4px 3px;box-shadow:0 1px 3px #17493b12;white-space:normal;overflow-wrap:anywhere}
.calendar .schedule-time{color:#1d74a9;font-weight:700;white-space:nowrap}
.calendar .schedule-separator{color:#678b7e;font-weight:500}
.calendar .schedule-names{color:#153b52;font-weight:500}
.calendar .schedule-line span{display:inline!important;font:inherit}
.calendar .day .schedule-line:hover{background:#e7f6ef}

@page{size:landscape;margin:8mm}
@media print{
  html,body{background:#fff!important;color:#152e28!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .app{display:block;min-height:0}
  .sidebar,.topbar,.page-head,.stats,.calendar-legend,.content>p,.calendar-toolbar .month-control button,.calendar-toolbar>.button{display:none!important}
  .main,.content{display:block;width:100%;max-width:none;margin:0;padding:0}
  .card{border:0;border-radius:0;box-shadow:none;overflow:visible}
  .calendar-toolbar{display:block;padding:0 0 7px;border:0;background:#fff}
  .calendar-toolbar .month-control{justify-content:center}
  .calendar-toolbar .month-control h2{font-size:18pt;color:#163250}
  .calendar{display:grid!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;overflow:visible!important;border-color:#9dbdb1}
  .calendar .weekday,.calendar .daynum{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .calendar .day{min-height:24mm;break-inside:avoid;background:#fff}
  .calendar .schedule-line{break-inside:avoid;box-shadow:none}
}

.monthly-tools{display:grid;grid-template-columns:minmax(115px,.8fr) minmax(115px,.8fr) minmax(170px,1.4fr) minmax(125px,.8fr) auto;gap:12px;align-items:end;padding:16px 18px;border-bottom:1px solid var(--line);background:#f8fbf9}
.monthly-table{min-width:560px}
.monthly-table th{background:#e6f1f8;color:#205d50;text-transform:none;letter-spacing:0}
.monthly-table td{padding:9px 16px}
.shift-choice{display:flex;align-items:center;gap:8px;color:#1c5874}
.shift-choice input{accent-color:#1d74a9;width:16px;height:16px}
.monthly-create{white-space:nowrap}
.monthly-tools input{min-height:39px}
@media(max-width:900px){.monthly-tools{grid-template-columns:1fr 1fr}.monthly-create{grid-column:1/-1}}
@media(max-width:580px), (max-width:900px) and (max-aspect-ratio:4/5){.monthly-tools{grid-template-columns:1fr}.monthly-create{grid-column:auto}}
@media(max-width:700px), (max-width:900px) and (max-aspect-ratio:4/5){.data-transfer-grid{grid-template-columns:1fr}}
@media(max-width:580px), (max-width:900px) and (max-aspect-ratio:4/5){
  html,body{width:100%;max-width:100%;min-width:0;overflow-x:clip}
  .app,.main,.content,#view{width:100%;max-width:100%;min-width:0}
  .app,.app.sidebar-collapsed{display:flex;flex-direction:column;min-height:100vh;grid-template-columns:1fr}
  .sidebar,.app.sidebar-collapsed .sidebar{position:sticky;top:0;align-self:flex-start;width:100%;z-index:30;padding:6px 8px;gap:0;overflow:visible;box-shadow:0 3px 12px #10263118}
  .sidebar{order:1}
  .sidebar .brand{display:none}
  .sidebar>div:not(.brand){min-width:0}
  .nav-label{display:none!important}
  .nav{display:flex;width:100%;justify-content:safe center;gap:7px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;scroll-snap-type:x proximity;padding:1px 2px 5px}
  .nav button,.app.sidebar-collapsed .nav button{flex:0 0 44px;min-height:42px;justify-content:center;padding:8px;gap:0;font-size:12px;white-space:nowrap;scroll-snap-align:start}
  .nav button .label,.app.sidebar-collapsed .nav button .label{display:none!important}
  .nav .icon{font-size:20px;width:auto}
  .sidebar .side-link-box,.app.sidebar-collapsed .sidebar .side-link-box{display:none!important}

<script>
const OFFLINE_KEY='escala-clara-offline-v1';
window.offlineMode=sessionStorage.getItem('escala-clara-offline-mode')==='1';
if(window.offlineMode)document.body.classList.add('offline-mode');
window.firebaseReady=false;
try{
  if(typeof firebase!=='undefined'){
    firebase.initializeApp({
      apiKey:'AIzaSyBFG6hqg5TOzC_r5U0c8kwT5e7K88j1zWs',
      authDomain:'gestao-de-plantoes-f7a07.firebaseapp.com',
      projectId:'gestao-de-plantoes-f7a07',
      appId:'1:425208993087:web:4ebe7f04e91264ab866f8a'
    });
    window.firebaseAuth=firebase.auth();
    window.firebaseCloudDb=firebase.firestore();
    window.firebaseReady=true;
  }
}catch(error){console.error('Não foi possível iniciar o Firebase.',error)}

function authErrorMessage(error){
  const messages={
    'auth/invalid-email':'Confira o formato do e-mail.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
    'auth/network-request-failed':'Sem conexão com a internet. Verifique a conexão e tente novamente.',
    'auth/operation-not-allowed':'O login por e-mail e senha não está habilitado no Firebase.',
    'auth/invalid-api-key':'A chave de configuração do Firebase está inválida. Confira a chave no app Web do projeto.',
    'auth/api-key-not-valid':'A chave de configuração do Firebase está inválida. Confira a chave no app Web do projeto.',
    'auth/app-not-authorized':'Este site não está autorizado a usar a configuração do Firebase.',
    'auth/unauthorized-domain':'O domínio do site precisa estar autorizado no Firebase Authentication.'
  };
  const code=error?.code||'erro-sem-código';
  return `${messages[code]||'Não foi possível concluir. Confira a configuração do Firebase e tente novamente.'} (${code})`;
}

window.authUI={
  async signIn(event){
    event.preventDefault();
    const feedback=document.querySelector('#login-feedback'),button=document.querySelector('#login-form .login-submit');
    if(!window.firebaseReady){feedback.textContent='Não foi possível carregar o Firebase. Atualize a página e tente novamente.';return false}
    feedback.textContent='';button.disabled=true;
    try{
      await window.firebaseAuth.signInWithEmailAndPassword(document.querySelector('#login-email').value.trim(),document.querySelector('#login-password').value);
    }catch(error){console.error('Falha no login Firebase:',error?.code);feedback.textContent=authErrorMessage(error)}
    finally{button.disabled=false}
    return false;
  },
  showForgot(){
    const title=document.querySelector('#login-title'),sub=document.querySelector('#login-subtitle'),form=document.querySelector('#login-form'),forgot=document.querySelector('#forgot-button'),feedback=document.querySelector('#login-feedback');
    title.textContent='Recuperar senha';sub.textContent='Informe o e-mail da sua conta para receber as instruções.';
    form.innerHTML='<div class="login-field"><label for="reset-email">E-mail</label><input id="reset-email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required></div><button class="login-submit" type="submit">Enviar instruções</button>';
    form.onsubmit=async(event)=>{
      event.preventDefault();
      if(!window.firebaseReady){feedback.textContent='Não foi possível carregar o Firebase. Atualize a página e tente novamente.';return false}
      try{await window.firebaseAuth.sendPasswordResetEmail(document.querySelector('#reset-email').value.trim());feedback.style.color='#1d74a9';feedback.textContent='Se o e-mail estiver cadastrado, você receberá as instruções de recuperação.'}
      catch(error){console.error('Falha na recuperação Firebase:',error?.code);feedback.style.color='#a94f4f';feedback.textContent=authErrorMessage(error)}
      return false;
    };
    forgot.textContent='Voltar ao login';forgot.onclick=()=>location.reload();feedback.textContent='';
  },
  enterOffline(){if(window.app)window.app.enterOfflineMode()},
  async logout(){
    if(window.offlineMode){sessionStorage.removeItem('escala-clara-offline-mode');window.offlineMode=false}
    else try{if(window.firebaseAuth)await window.firebaseAuth.signOut()}catch(error){console.error('Falha ao sair.',error)}
    document.body.classList.remove('authenticated','offline-mode');location.reload();
  }
};
if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(error=>console.warn('Cache offline indisponível.',error)));
}
(()=>{
  const button=document.querySelector('#install-app'),note=document.querySelector('#install-note');
  if(!button||!('serviceWorker' in navigator))return;
  let installPrompt=null;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone)return;
  button.hidden=false;
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;button.textContent='Instalar app'});
  button.addEventListener('click',async()=>{
    if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}
    note.hidden=false;
    note.textContent=isIOS?'No Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.':'Para instalar, abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.';
  });
  window.addEventListener('appinstalled',()=>{button.hidden=true;note.hidden=false;note.textContent='App instalado com sucesso.'});
})();
(()=>{
  'use strict';
  const KEY='escala-clara-v1';
  const DEFAULT_LINK='https://docs.google.com/forms/d/e/1FAIpQLScdKzwGGrK8FA7Ubb-Sg3xEmmJUKFbB0P0v9ly6w0WHknD27Q/viewform?usp=dialog';
  let db=load(),
      cloudUser=null,
      cloudDataReady=false,
      cloudSaveTimer=null,
      page='manual',
      month=new Date(new Date().getFullYear(),new Date().getMonth(),1),
      calendarMode='escalados',
      matrixFilter='all',
      availTab='todos',
      plantaoMonth=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'),
      monthlyHospital='',
      monthlyVacancies=2;

  const $=s=>document.querySelector(s),
        esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function normalizeDb(x){
    x=x&&typeof x==='object'?x:{};
    x.nurses=Array.isArray(x.nurses)?x.nurses:[];
    x.shifts=Array.isArray(x.shifts)?x.shifts:[];
    x.availability=x.availability&&typeof x.availability==='object'?x.availability:{};
    x.rosters=x.rosters&&typeof x.rosters==='object'?x.rosters:{};
    x.manualEntries=Array.isArray(x.manualEntries)?x.manualEntries:[];
    if(!x.externalLink||x.externalLink==='https://forms.google.com'||x.externalLink.includes('1FAIpQLScgV3081gzDz5Ff24UJjRFN3K7UfPLrtTU-rmIZjs4o8DPXEQ'))x.externalLink=DEFAULT_LINK;
    x.adminPassword=x.adminPassword||'admin123';
    x.shifts.forEach((s,i)=>{s.code=s.code||('P'+String(i+1).padStart(3,'0'));s.hospital=s.hospital||s.unit||'';s.vacancies=Number(s.vacancies||2)});
    return x;
  }

  function load(){
    try{
      let raw=window.offlineMode
        ?(localStorage.getItem(OFFLINE_KEY)||sessionStorage.getItem(OFFLINE_KEY)||localStorage.getItem(KEY)||sessionStorage.getItem(KEY))
        :(localStorage.getItem(KEY)||sessionStorage.getItem(KEY));
      return normalizeDb(JSON.parse(raw)||{});
    }catch{
      return normalizeDb({externalLink:DEFAULT_LINK});
    }
  }

  function save(){
    const serialized=JSON.stringify(db);
    if(window.offlineMode){
      try{localStorage.setItem(OFFLINE_KEY,serialized);updateSaveBadge('Salvo somente no cache local','gold')}
      catch(e){try{sessionStorage.setItem(OFFLINE_KEY,serialized);updateSaveBadge('Salvo na sessão offline','gold')}
        catch(err){updateSaveBadge('Cache offline indisponível','red');toast('Não foi possível salvar neste navegador.')}}
      return;
    }
    let savedLocally=false;
    try{
      localStorage.setItem(KEY,serialized);
      savedLocally=true;
    }catch(e){
      try{
        sessionStorage.setItem(KEY,JSON.stringify(db));
        savedLocally=true;
      }catch(err){
        updateSaveBadge('Erro ao salvar no cache','red');
      }
    }
    if(cloudUser&&cloudDataReady&&window.firebaseCloudDb){
      try{localStorage.setItem(OFFLINE_KEY,serialized)}catch(e){}
      clearTimeout(cloudSaveTimer);
      updateSaveBadge('Sincronizando com Firebase…','gold');
      cloudSaveTimer=setTimeout(async()=>{
        try{
          const payload=JSON.stringify(db);
          if(new Blob([payload]).size>900000)throw new Error('O conjunto de dados ultrapassou o limite seguro para sincronização.');
          await window.firebaseCloudDb.collection('appData').doc('escalaClara').set({payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
          updateSaveBadge('Salvo no Firebase','teal');
        }catch(error){
          console.error('Falha ao sincronizar com o Firestore.',error);
          updateSaveBadge('Falha ao salvar no Firebase','red');
          toast('Não foi possível sincronizar os dados com o Firebase.');
        }
      },700);
    }else if(savedLocally){
      updateSaveBadge('Salvo no navegador','teal');
    }
  }

  function saveManualDraft(){
    if(page!=='manual') return;
    db.manualEntries=[...document.querySelectorAll('.manual-table tbody tr')].map(tr=>({
      name:tr.querySelector('.manual-name')?.value.trim()||'',
      available:tr.querySelector('.manual-available')?.value||'yes',
      shiftText:tr.querySelector('.manual-shifts-text')?.value.trim()||''
    }));
    db.manualPasteDraft=$('#manual-paste')?.value||'';
    save();
  }

  function updateSaveBadge(msg,type){
    const el=$('#save-status');
    if(!el) return;
    const styles={
      teal:{bg:'#e6f1f8',color:'#1d74a9',dot:'#1d74a9'},
      gold:{bg:'#fff3dc',color:'#b27b18',dot:'#e1a947'},
      red:{bg:'#fcf0f0',color:'#a94f4f',dot:'#b85454'}
    }[type]||{bg:'#e6f1f8',color:'#1d74a9',dot:'#1d74a9'};
    el.style.background=styles.bg;
    el.style.color=styles.color;
    el.innerHTML=`<span style="width:7px;height:7px;border-radius:50%;background:${styles.dot};display:inline-block"></span> ${esc(msg)}`;
  }

    if(shifts.some(s=>s.date.slice(0,7)===key)) return;
    let now=new Date(),
        today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),
        ordered=shifts.slice().sort((a,b)=>a.date.localeCompare(b.date)),
        target=ordered.find(s=>s.date>=today)||ordered[ordered.length-1];
    if(target){
      let d=new Date(target.date+'T12:00:00');
      month=new Date(d.getFullYear(),d.getMonth(),1);
    }

  function calendarCells(){
    let first=new Date(month.getFullYear(),month.getMonth(),1),
        start=new Date(first);
    start.setDate(1-first.getDay());
    let out='';
    for(let i=0;i<42;i++){
      let d=new Date(start);
      d.setDate(start.getDate()+i);
      let ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
          shifts=db.shifts.filter(s=>s.date===ds).map(s=>{
            let r=db.rosters?.[s.id]||{},
                available=db.nurses.filter(n=>db.availability[`${n.id}:${s.id}`]==='yes'),
                assigned=r.assigned?.length?r.assigned:available.slice(0,s.vacancies||2).map(n=>n.id),
                ids=calendarMode==='disponiveis'?available.filter(n=>!assigned.includes(n.id)).map(n=>n.id):assigned,
                names=ids.map(x=>db.nurses.find(n=>n.id===x)?.name).filter(Boolean);
            return{shift:s,names};
          }).filter(x=>x.names.length).sort((a,b)=>String(a.shift.start||'').localeCompare(String(b.shift.start||''))),
          outside=d.getMonth()!==month.getMonth();
      out+=`<div class="day ${outside?'outside':''}">
        <div class="daynum">${d.getDate()}</div>
        ${shifts.slice(0,3).map(item=>{
          let s=item.shift,names=item.names;
          return `<div class="event schedule-line ${calendarMode==='disponiveis'?'available-slot':''}" title="${calendarMode==='disponiveis'?'Disponível e não escalado':'Escalado'} · ${esc(s.name||s.code||'Plantão')}">
            <span class="schedule-time">${esc(s.start||'—')}</span>
            <span class="schedule-separator">-</span>
            <span class="schedule-names">${esc(names.join(', '))}</span>
          </div>`;
        }).join('')}
        ${shifts.length>3?`<div class="event more">+${shifts.length-3} plantões</div>`:''}
      </div>`;
    }
    return out;
  }

  function pdfHex(value){
    let map={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};
    return Array.from(String(value).normalize('NFC')).map(ch=>{
      let c=ch.codePointAt(0);
      if(c>=32&&c<=126||c>=160&&c<=255) return c.toString(16).padStart(2,'0');
      return(map[ch]??63).toString(16).padStart(2,'0');
    }).join('').toUpperCase();
  }

  function pdfRgb(hex){
    let n=parseInt(hex.replace('#',''),16);
    return `${((n>>16)&255)/255} ${((n>>8)&255)/255} ${(n&255)/255}`;
  }

  function pdfWrap(text,max){
    let words=String(text).split(/\s+/),lines=[],line='';
    for(let w of words){
      if(line&&(`${line} ${w}`).length>max){ lines.push(line); line=w; }
      else line=line?`${line} ${w}`:w;
    }
    if(line) lines.push(line);
    return lines;
  }

    let W=842,H=595,M=24,GW=W-2*M,CW=GW/7,BH=30,WH=20,CH=80,
        commands=[],
        fill=(x,y,w,h,color)=>commands.push(`${pdfRgb(color)} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`),
        stroke=(x,y,w,h,color,width=0.6)=>commands.push(`${pdfRgb(color)} RG ${width} w ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`),
        txt=(x,y,size,text,color='#173f35',font='F1')=>commands.push(`BT /${font} ${size} Tf ${pdfRgb(color)} rg 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm <${pdfHex(text)}> Tj ET`);

    let bandY=H-M-BH;
    fill(M,bandY,GW,BH,'#E9F5F1');
    stroke(M,bandY,GW,BH,'#c6dce8');
    txt(M+8,bandY+9,16,formatMonthYear(month),'#163250','F2');

    let weekdayY=bandY-WH,days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    days.forEach((d,i)=>{
      let x=M+i*CW;
      fill(x,weekdayY,CW,WH,'#DCEFE8');
      stroke(x,weekdayY,CW,WH,'#c6dce8');
      txt(x+5,weekdayY+6,8,d,'#163250','F2');
    });

    let first=new Date(month.getFullYear(),month.getMonth(),1),
        start=new Date(first);
    start.setDate(1-first.getDay());

    for(let i=0;i<42;i++){
      let d=new Date(start);
      d.setDate(start.getDate()+i);
      let ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
          col=i%7,row=Math.floor(i/7),
          x=M+col*CW,y=weekdayY-(row+1)*CH;

      fill(x,y,CW,CH,'#FFFFFF');
      stroke(x,y,CW,CH,'#c6dce8');
      fill(x,y+CH-14,CW,14,'#EFF7F3');
      commands.push(`${pdfRgb('#d6e7e9')} RG 0.5 w ${x.toFixed(2)} ${(y+CH-14).toFixed(2)} m ${(x+CW).toFixed(2)} ${(y+CH-14).toFixed(2)} l S`);
      txt(x+CW-16,y+CH-10,7,String(d.getDate()),d.getMonth()===month.getMonth()?'#315F54':'#A8BDB5');

      let shifts=db.shifts.filter(s=>{
        if(s.date!==ds) return false;
        let r=db.rosters?.[s.id]||{},
            ids=r.assigned?.length?r.assigned:db.nurses.filter(n=>db.availability[`${n.id}:${s.id}`]==='yes').slice(0,s.vacancies||2).map(n=>n.id);
        return ids.some(id=>db.nurses.find(n=>n.id===id)?.name);
      }).sort((a,b)=>String(a.start||'').localeCompare(String(b.start||''))).slice(0,3),
          cy=y+CH-20;

      for(let s of shifts){
        let r=db.rosters?.[s.id]||{},
            ids=r.assigned?.length?r.assigned:db.nurses.filter(n=>db.availability[`${n.id}:${s.id}`]==='yes').slice(0,s.vacancies||2).map(n=>n.id),
            names=ids.map(id=>db.nurses.find(n=>n.id===id)?.name).filter(Boolean),
            lines=pdfWrap(`${s.start||'—'} - ${names.join(', ')}`,31),
            cardH=lines.length*8+5;

        cy-=cardH+3;
        if(cy<y+2) break;
        fill(x+3,cy,CW-6,cardH,'#EDF7F2');
        fill(x+3,cy,2.5,cardH,'#4C9D84');
        lines.forEach((line,j)=>txt(x+8,cy+cardH-9-j*8,6.6,line,j===0?'#176B5C':'#24483F',j===0?'F2':'F1'));
      }
      if(db.shifts.filter(s=>s.date===ds).length>3&&cy>y+9){
        txt(x+5,y+4,6.5,`+${db.shifts.filter(s=>s.date===ds).length-3} plantões`,'#52796D');
      }
    }

    let stream=commands.join('\n'),objs=[];
    objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
    objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
    objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>';
    objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    objs[6]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;

    let pdf='%PDF-1.4\n',offsets=[0];
    for(let i=1;i<objs.length;i++){
      offsets[i]=pdf.length;
      pdf+=`${i} 0 obj\n${objs[i]}\nendobj\n`;
    }
    let xref=pdf.length;
    pdf+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
    for(let i=1;i<objs.length;i++) pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
    pdf+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return Uint8Array.from(pdf,c=>c.charCodeAt(0)&255);
  }

    createMonthlyShifts(){
      let ym=plantaoMonth||(new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')),
          hospital=(document.querySelector('#monthlyHospital').value.trim()||monthlyHospital||db.shifts[0]?.hospital||'Humân'),
          vacancies=Math.max(1,Number(document.querySelector('#monthlyVacancies').value)||2),
          checks=[...document.querySelectorAll('.monthly-shift:checked')];

      if(!checks.length){
        toast('Marque ao menos um turno para criar.');
        return;
      }

      let max=db.shifts.reduce((m,x)=>Math.max(m,parseInt(String(x.code||'').slice(1),10)||0),0),
          created=0,skipped=0;

      for(let c of checks){
        let date=c.dataset.date,
            start=c.dataset.start,
            exists=db.shifts.some(s=>s.date===date&&s.start===start&&(s.hospital||s.unit||'').trim().toLocaleLowerCase('pt-BR')===hospital.toLocaleLowerCase('pt-BR'));
        if(exists){ skipped++; continue; }
        let hour=Number(start.slice(0,2)),
            endHour=(hour+12)%24,
            end=`${String(endHour).padStart(2,'0')}:${start.slice(3)}`,
            code='P'+String(++max).padStart(3,'0'),
            name=start==='07:00'?'Diurno':'Noturno';
        db.shifts.push({id:id(),code,name,date,start,end,hospital,unit:hospital,vacancies});
        created++;
      }

      if(!created){
        toast('Os turnos selecionados já estavam cadastrados.');
        return;
      }

      monthlyHospital=hospital;
      monthlyVacancies=vacancies;
      plantaoMonth=ym;
      db.rosters=db.rosters||{};
      try{ save(); }catch{
        renderShifts();
        toast('Plantões criados (salvamento limitado).');

    importManualPaste(){
      let box=document.querySelector('#manual-paste'),text=box?.value||'';
      if(!text.trim()){ toast('Cole as três colunas no campo acima primeiro.'); return; }
      let lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim());
      if(lines.length&&/nome do enfermeiro/i.test(lines[0])) lines.shift();
      let rows=lines.map(line=>{
        let c=line.split('\t');
        if(c.length<2&&line.includes(';')) c=line.split(';');
        let answer=(c[1]||'').trim().toLocaleLowerCase('pt-BR');
        return{
          name:(c[0]||'').trim(),
          available:['sim','s','yes','y','true'].includes(answer)?'yes':'no',
          shiftText:(c.slice(2).join(' ')||'').trim()
        };
      }).filter(x=>x.name);

      document.querySelector('.manual-table tbody').innerHTML=(rows.length?rows:[{}]).map(manualRowHtml).join('');
      box.value='';
      saveManualDraft();
      toast(`${rows.length} linha(s) importada(s)`);
    },

    removeManualRow(button){
      let body=document.querySelector('.manual-table tbody'),row=button.closest('tr');
      if(row) row.remove();
      if(!body.children.length) body.insertAdjacentHTML('beforeend',manualRowHtml());
      saveManualDraft();
    },

    saveManual(){
      let paste=document.querySelector('#manual-paste');
      if(paste?.value.trim()) this.importManualPaste();
      let rows=[...document.querySelectorAll('.manual-table tbody tr')].map(tr=>({
        name:tr.querySelector('.manual-name').value.trim(),
        available:tr.querySelector('.manual-available').value,
        shiftText:tr.querySelector('.manual-shifts-text').value.trim()
      })).filter(x=>x.name);

      if(!rows.length){ toast('Insira ou cole ao menos um nome de enfermeiro.'); return; }

      db.shifts=db.shifts||[];
      let details=[];
      for(let row of rows){
        for(let m of row.shiftText.matchAll(/\b(P\d+)\s+(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2})\s+([^,;\n]+)/gi)){
          details.push({code:m[1].toUpperCase(),day:m[2],month:m[3],year:m[4],start:m[5],hospital:m[6].trim()});
        }
      }

      for(let d of details){
        if(db.shifts.some(s=>String(s.code||'').toUpperCase()===d.code)) continue;
        let [hh,mm]=d.start.split(':').map(Number),
            endHour=(hh+12)%24,
            end=`${String(endHour).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
        db.shifts.push({id:id(),code:d.code,name:hh>=6&&hh<18?'Diurno':'Noturno',date:`${d.year}-${d.month}-${d.day}`,start:d.start,end,hospital:d.hospital||'Hospital',unit:d.hospital||'Hospital',vacancies:2});
      }

      rows=rows.map(row=>{
        let codes=[...row.shiftText.matchAll(/\bP\d+\b/gi)].map(m=>m[0].toUpperCase()),
            shifts=db.shifts.filter(s=>codes.includes(String(s.code||'').toUpperCase())).map(s=>s.id);
        return{...row,shifts};
      });

      if(rows.some(x=>x.available==='yes'&&!x.shifts.length)){
        toast('Plantões não identificados. Inclua código e data/hora (ex: P003 09/08/2026 07:00).');
        return;
      }

      db.manualEntries=rows;
      db.manualPasteDraft='';
      for(let row of rows){
        let nurse=db.nurses.find(n=>(n.name||'').trim().toLocaleLowerCase('pt-BR')===row.name.toLocaleLowerCase('pt-BR'));
        if(!nurse){
          nurse={id:id(),name:row.name,reg:'',phone:'',role:'Enfermeiro(a)',type:'Equipe'};
          db.nurses.push(nurse);
        }
        for(let shift of db.shifts){
          let key=nurse.id+':'+shift.id;
          if(row.available==='no') db.availability[key]='no';
          else if(row.shifts.includes(shift.id)) db.availability[key]='yes';
          else if(!db.availability[key]) db.availability[key]='no';
        }
      }

      db.rosters=db.rosters||{};
      db.shifts.forEach(s=>{
        let available=db.nurses.filter(n=>db.availability[`${n.id}:${s.id}`]==='yes'),v=s.vacancies||2;
        db.rosters[s.id]={assigned:available.slice(0,v).map(n=>n.id),waitlist:available.slice(v).map(n=>n.id),third:[]};
      });

      try{ save(); }catch{ toast('Erro no salvamento local.'); return; }
      renderManual();
      toast('Dados salvos e escala atualizada');
    },

        toast('Link copiado para a área de transferência!');

        toast('Não foi possível copiar o link.');
      }
      document.body.removeChild(t);
    },
    updateLinkUI(){
      let box=$('#sidebar-link-box');
      if(!box) return;
      let hasLink=!!(db.externalLink&&db.externalLink.trim());
      if(hasLink){
        box.innerHTML=`
          <div class="side-link-title">Acesso Forms Disponibilidade</div>
          <a href="${esc(db.externalLink)}" target="_blank" rel="noopener noreferrer" class="side-link-btn" title="${esc(db.externalLink)}">
            <span>Abrir link</span>
            <span class="icon">↗</span>
          </a>
          <button type="button" class="side-link-btn secondary" onclick="app.copyLink()" title="Copiar link para a área de transferência">
            <span>Copiar link</span>
            <span class="icon">📋</span>
          </button>
          <button type="button" class="side-link-manage-btn" onclick="app.openLinkAdminModal()">
            <span>⚙ Alterar / Remover (Adm)</span>
          </button>`;
      } else {
        box.innerHTML=`
          <div class="side-link-title">Acesso Forms Disponibilidade</div>
          <button type="button" class="side-link-manage-btn" onclick="app.openLinkAdminModal()">
            <span>＋ Incluir link (Adm)</span>
          </button>`;
      }
    },
    printCalendar(){ window.print(); },

    exportCalendarPdf(){
      let bytes=makeCalendarPdf(),
          year=month.getFullYear(),
          mon=String(month.getMonth()+1).padStart(2,'0');
      download(new Blob([bytes],{type:'application/pdf'}),'calendario-'+year+'-'+mon+'.pdf');
      toast('PDF gerado com sucesso!');
    },

    closeModal(){ $('#modal-root').innerHTML=''; },

    exportData(){
      let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
      download(blob,'escala-clara-dados.json');
      toast('Backup JSON exportado!');
    },

    importData(input){
      let file=input.files?.[0];
      if(!file) return;
      let r=new FileReader();
      r.onload=()=>{
        try{
          let x=JSON.parse(r.result);
          if(!Array.isArray(x.nurses)||!Array.isArray(x.shifts)||typeof x.availability!=='object') throw 0;
          x.rosters=x.rosters||{};
          x.manualEntries=x.manualEntries||[];
          x.shifts.forEach((s,i)=>{
            s.code=s.code||('P'+String(i+1).padStart(3,'0'));
            s.hospital=s.hospital||s.unit||'';
            s.vacancies=Number(s.vacancies||2);
          });
          db={nurses:x.nurses,shifts:x.shifts,availability:x.availability,rosters:x.rosters,manualEntries:x.manualEntries||[]};
          save();
          render();
          toast('Dados importados com sucesso');
        }catch{
          toast('Arquivo JSON inválido.');
        }
      };
      r.readAsText(file);
    },

    exportCalendar(){
      let rows=[['Código','Plantão','Data','Horário','Hospital','Vagas','Escalados','Fila de espera','Plantão terceiro']];
      [...db.shifts].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
        let r=db.rosters?.[s.id]||{},
            names=ids=>(ids||[]).map(x=>db.nurses.find(n=>n.id===x)?.name).filter(Boolean).join('; ');
        rows.push([s.code,s.name,s.date,`${s.start}-${s.end}`,s.hospital||s.unit||'',s.vacancies||2,names(r.assigned),names(r.waitlist),s.thirdShift||'']);
      });
      let csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');
      download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'calendario-plantões.csv');
      toast('Escala CSV exportada!');
    },

    resetDemo(){
      modal('Carregar Exemplo', '<p>Deseja carregar o exemplo? Isso substituirá os dados atuais.</p>', 'return app.doResetDemo()', 'Carregar');
    },
    doResetDemo(){
      let n1={id:id(),name:'Mariana Costa',reg:'COREN-SP 123456',phone:'(11) 99999-1111',role:'Enfermeira',type:'Efetivo'},
          n2={id:id(),name:'Rafael Mendes',reg:'COREN-SP 234567',phone:'(11) 98888-2222',role:'Enfermeiro',type:'Efetivo'},
          n3={id:id(),name:'Camila Oliveira',reg:'COREN-SP 345678',phone:'(11) 97777-3333',role:'Enfermeira',type:'Temporário'},
          d=new Date(),
          date=(offset)=>{let x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+offset);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;},
          s1={id:id(),code:'P001',name:'Diurno',date:date(1),start:'07:00',end:'19:00',hospital:'Humân',unit:'Humân',vacancies:2},
          s2={id:id(),code:'P002',name:'Noturno',date:date(1),start:'19:00',end:'07:00',hospital:'Humân',unit:'Humân',vacancies:2},
          s3={id:id(),code:'P003',name:'Diurno',date:date(2),start:'07:00',end:'19:00',hospital:'Hospital Central',unit:'Hospital Central',vacancies:2};

      db={
        nurses:[n1,n2,n3],
        shifts:[s1,s2,s3],
        availability:{
          [`${n1.id}:${s1.id}`]:'yes',
          [`${n2.id}:${s1.id}`]:'no',
          [`${n3.id}:${s1.id}`]:'yes',
          [`${n1.id}:${s2.id}`]:'no',
          [`${n2.id}:${s2.id}`]:'yes',
          [`${n3.id}:${s2.id}`]:'yes',
          [`${n1.id}:${s3.id}`]:'yes',
          [`${n2.id}:${s3.id}`]:'yes'
        },
        rosters:{},
        manualEntries:[],
        externalLink:db.externalLink||DEFAULT_LINK,
        adminPassword:db.adminPassword||'admin123'
      };

      db.shifts.forEach(s=>{
        let a=db.nurses.filter(n=>db.availability[`${n.id}:${s.id}`]==='yes'),v=s.vacancies||2;
        db.rosters[s.id]={assigned:a.slice(0,v).map(n=>n.id),waitlist:a.slice(v).map(n=>n.id),third:[]};
      });

      save();
      this.closeModal();
      render();
      toast('Exemplo carregado');
      return false;
    }
  };

  function download(blob,name){
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  if(localStorage.getItem('escala_sidebar_collapsed')==='1'){
    document.querySelector('.app')?.classList.add('sidebar-collapsed');
  }

  render();

  if(window.offlineMode)updateSaveBadge('Modo offline · cache local','gold');

  if(window.firebaseReady){
    window.firebaseAuth.onAuthStateChanged(async user=>{
      if(window.offlineMode){document.body.classList.remove('authenticated');return}
      cloudUser=user||null;
      cloudDataReady=false;
      if(!user){document.body.classList.remove('authenticated');return}
      const docRef=window.firebaseCloudDb.collection('appData').doc('escalaClara');
      try{
        const snapshot=await docRef.get();
        if(snapshot.exists&&typeof snapshot.data().payload==='string'){
          db=normalizeDb(JSON.parse(snapshot.data().payload));
        }else if(!snapshot.exists){
          const payload=JSON.stringify(db);
          await docRef.set({payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        }
        const offlineCopy=JSON.stringify(db);
        try{localStorage.setItem(OFFLINE_KEY,offlineCopy)}catch(e){try{sessionStorage.setItem(OFFLINE_KEY,offlineCopy)}catch(err){}}
        cloudDataReady=true;
        document.body.classList.add('authenticated');
        updateSaveBadge('Conectado ao Firebase','teal');
        render();
      }catch(error){
        console.error('Não foi possível carregar os dados do Firestore.',error);
        cloudUser=null;
        document.body.classList.remove('authenticated');
        const feedback=$('#login-feedback');
        feedback.textContent='Login aceito, mas o banco não liberou o acesso. Verifique se as regras do Firestore estão publicadas para esta conta.';
        await window.firebaseAuth.signOut().catch(()=>{});
      }
    });
  }else{
    $('#login-feedback').textContent='Não foi possível carregar o Firebase. Verifique sua conexão e atualize a página.';
  }
})();
</script>
</body>
</html>
